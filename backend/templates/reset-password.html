<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buat Password Baru · eSikap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <!--
    Tampilan mengikuti wireframe Figma "H4 Buat password baru".
    Foto latar diambil dari backend/templates/background-itk.jpg.jpeg lewat endpoint
    reset password. Logo tetap ditanam sebagai data URI
    karena ukurannya kecil.
  -->
  <style>
    :root {
      --page: #faf7fd;
      --card: #ffffff;
      --muted-surface: #faf9fc;
      --border-subtle: #e2e0ec;
      --brand: #603591;
      --brand-hover: #4d2a75;
      --text: #1b1930;
      --secondary: #6b6780;
      --muted: #9c97ae;
      --ok: #16a34a;
      --no-bg: #fef2f2;
      --no-border: #fca5a5;
      --no-text: #7f1d1d;
      --sukses-bg: #f0fdf4;
      --sukses-border: #86efac;
      --sukses-text: #14532d;
      --shadow-sm: 0 1px 3px rgba(28, 28, 26, 0.1), 0 1px 2px rgba(28, 28, 26, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--page);
    }
    /* Foto latar dipasang di lapisan tetap, bukan background-attachment: fixed,
       supaya selalu menutup seluruh layar, termasuk di HP (Safari iOS
       mengabaikan fixed). Konten di atasnya bebas di-scroll. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--page) url('/api/auth/reset-password-background') center / cover no-repeat;
    }
    .halaman {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 16px;
    }
    .logo { width: 125px; height: 40px; object-fit: contain; }
    .kartu {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; }
    .sapaan {
      margin: 0;
      text-align: center;
      font-size: 19px;
      line-height: 26px;
      font-weight: 600;
      color: var(--secondary);
    }
    .sapaan strong { color: var(--text); font-weight: 600; word-break: break-all; }
    form { display: flex; flex-direction: column; gap: 24px; margin: 0; }
    .isian { display: flex; flex-direction: column; gap: 8px; }
    .isian > label {
      font-size: 15px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .kotak { position: relative; }
    .kotak input {
      width: 100%;
      padding: 16px 84px 16px 16px;
      font: 400 19px/26px 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
    }
    .kotak input::placeholder { color: var(--muted); }
    .kotak input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(96, 53, 145, 0.2); }
    .kotak input[aria-invalid='true'] { border-color: var(--no-border); }
    .lihat {
      position: absolute;
      inset: 0 0 0 auto;
      padding: 0 16px;
      border: 0;
      background: none;
      font: 600 12px 'Inter', sans-serif;
      letter-spacing: 0.5px;
      color: var(--brand);
      cursor: pointer;
    }
    .petunjuk { margin: 0; font-size: 14px; line-height: 20px; color: var(--no-text); }
    .tombol {
      width: 100%;
      padding: 16px 24px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font: 600 22px/28px 'Inter', sans-serif;
      letter-spacing: 0.2px;
      cursor: pointer;
    }
    .tombol:hover { background: var(--brand-hover); }
    .tombol:disabled { opacity: 0.6; cursor: not-allowed; }
    .pemisah { height: 1px; border: 0; margin: 0; background: var(--border-subtle); }
    .syarat {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: var(--muted-surface);
      border-radius: 6px;
      color: var(--secondary);
    }
    .syarat-judul { margin: 0; font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: 0.5px; }
    .syarat ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }
    .syarat li.ok { color: var(--ok); }
    .syarat li::before { content: '•'; display: inline-block; width: 18px; }
    .syarat li.ok::before { content: '✓'; }

    /* Notifikasi: judul singkat + deskripsi apa yang harus dilakukan. */
    .notifikasi {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 14px 16px;
      border: 1px solid var(--no-border);
      border-radius: 6px;
      background: var(--no-bg);
      color: var(--no-text);
    }
    .notifikasi[hidden] { display: none; }
    .notifikasi.sukses { border-color: var(--sukses-border); background: var(--sukses-bg); color: var(--sukses-text); }
    .notifikasi-judul { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
    .notifikasi-isi { margin: 0; font-size: 15px; line-height: 22px; }

    @media (max-width: 520px) {
      .halaman { gap: 24px; padding: 24px 16px; }
      .kartu { padding: 24px; }
      .sapaan, .kotak input { font-size: 17px; }
      .tombol { font-size: 18px; }
      .syarat ul { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <section class="kartu" aria-labelledby="judul">
      <h1 id="judul">Buat Password Baru</h1>

      <p class="sapaan" id="sapaan">
        <strong id="sapaanEmail">Hi!</strong> password barumu harus berbeda dari password yang pernah kamu pakai sebelumnya.
      </p>

      <div id="notifikasi" class="notifikasi" role="alert" aria-live="assertive" hidden>
        <p class="notifikasi-judul" id="notifikasiJudul"></p>
        <p class="notifikasi-isi" id="notifikasiIsi"></p>
      </div>

      <form id="resetForm" novalidate>
        <div class="isian">
          <label for="password">PASSWORD BARU</label>
          <div class="kotak">
            <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required />
            <button type="button" class="lihat" data-untuk="password" aria-label="Tampilkan password baru">LIHAT</button>
          </div>
        </div>

        <div class="isian">
          <label for="confirmPassword">ULANGI PASSWORD BARU</label>
          <div class="kotak">
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="••••••••" required aria-describedby="petunjukUlang" />
            <button type="button" class="lihat" data-untuk="confirmPassword" aria-label="Tampilkan ulangi password">LIHAT</button>
          </div>
          <p class="petunjuk" id="petunjukUlang" hidden>Belum sama dengan password baru.</p>
        </div>

        <button type="submit" class="tombol" id="tombolSimpan">SIMPAN PASSWORD BARU</button>
      </form>

      <hr class="pemisah" id="pemisah" />

      <div class="syarat" id="syarat">
        <p class="syarat-judul">SYARAT PASSWORD</p>
        <ul id="daftarSyarat" aria-live="polite"></ul>
      </div>
    </section>
  </main>

  <script>
    // Supabase mengirim token/error lewat hash (#access_token=... atau #error_code=...),
    // bukan query string, jadi harus dibaca di sisi klien — server tidak pernah menerima hash ini.
    const params = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = params.get('access_token');
    const errorCode = params.get('error_code');
    const errorDescription = params.get('error_description');

    const formEl = document.getElementById('resetForm');
    const passwordEl = document.getElementById('password');
    const confirmEl = document.getElementById('confirmPassword');
    const tombolEl = document.getElementById('tombolSimpan');
    const petunjukUlangEl = document.getElementById('petunjukUlang');
    const notifEl = document.getElementById('notifikasi');

    // Aturan yang sama dengan validPassword() di AuthController.
    const SYARAT = [
      { label: 'Minimal 8 karakter', nama: '8 karakter', cek: (p) => p.length >= 8 },
      { label: 'Huruf besar', nama: 'huruf besar', cek: (p) => /[A-Z]/.test(p) },
      { label: 'Huruf kecil', nama: 'huruf kecil', cek: (p) => /[a-z]/.test(p) },
      { label: 'Angka', nama: 'angka', cek: (p) => /\d/.test(p) },
      { label: 'Simbol (@ # $ ! _ -)', nama: 'simbol (@ # $ ! _ -)', cek: (p) => /[@#$!_\-]/.test(p) },
    ];

    function tampilkanNotifikasi(judul, isi, jenis = 'gagal') {
      document.getElementById('notifikasiJudul').textContent = judul;
      document.getElementById('notifikasiIsi').textContent = isi;
      notifEl.classList.toggle('sukses', jenis === 'sukses');
      notifEl.hidden = false;
    }

    function sembunyikanNotifikasi() {
      notifEl.hidden = true;
    }

    // Tautan tidak bisa dipakai lagi: form dan syarat disembunyikan,
    // yang tersisa hanya penjelasan langkah berikutnya.
    function tutupForm(judulKartu, judulNotif, isiNotif, jenis = 'gagal') {
      document.getElementById('judul').textContent = judulKartu;
      document.getElementById('sapaan').hidden = true;
      formEl.hidden = true;
      document.getElementById('pemisah').hidden = true;
      document.getElementById('syarat').hidden = true;
      tampilkanNotifikasi(judulNotif, isiNotif, jenis);
    }

    const MINTA_ULANG = 'Buka halaman masuk eSikap, klik "Lupa Password", lalu pakai tautan terbaru yang dikirim ke email kamu.';

    if (errorCode) {
      // Supabase sudah mendeteksi token invalid/expired/dipakai ulang
      if (errorCode === 'otp_expired') {
        tutupForm('Tautan Kedaluwarsa', 'Tautan reset password sudah tidak berlaku',
          'Tautan hanya bisa dipakai sekali dan dalam waktu terbatas. ' + MINTA_ULANG);
      } else {
        const alasan = (errorDescription || 'Tautan tidak valid.').replace(/\+/g, ' ');
        tutupForm('Tautan Tidak Valid', 'Tautan reset password tidak bisa dipakai', alasan + ' ' + MINTA_ULANG);
      }
    } else if (!accessToken) {
      tutupForm('Tautan Tidak Valid', 'Tautan reset password tidak lengkap',
        'Tautan ini terpotong atau sudah pernah dipakai. ' + MINTA_ULANG);
    } else {
      // Email diambil dari isi token (JWT) hanya untuk sapaan, tanpa request tambahan.
      try {
        const isiToken = JSON.parse(atob(accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (isiToken.email) document.getElementById('sapaanEmail').textContent = 'Hi! ' + isiToken.email + ',';
      } catch {
        // Token tetap dikirim ke server apa adanya; sapaan cukup tanpa email.
      }
    }

    // Bersihkan hash dari URL biar token tidak nyangkut di history browser
    window.history.replaceState({}, document.title, window.location.pathname);

    function perbaruiSyarat() {
      const p = passwordEl.value;
      document.getElementById('daftarSyarat').innerHTML = SYARAT
        .map((s) => `<li class="${s.cek(p) ? 'ok' : ''}">${s.label}</li>`)
        .join('');

      const belumSama = confirmEl.value !== '' && confirmEl.value !== p;
      petunjukUlangEl.hidden = !belumSama;
      confirmEl.setAttribute('aria-invalid', String(belumSama));
    }

    passwordEl.addEventListener('input', perbaruiSyarat);
    confirmEl.addEventListener('input', perbaruiSyarat);
    perbaruiSyarat();

    document.querySelectorAll('.lihat').forEach((tombol) => {
      tombol.addEventListener('click', () => {
        const input = document.getElementById(tombol.dataset.untuk);
        const terlihat = input.type === 'text';
        input.type = terlihat ? 'password' : 'text';
        tombol.textContent = terlihat ? 'LIHAT' : 'SEMBUNYI';
      });
    });

    // Pesan Supabase berbahasa Inggris diterjemahkan supaya pengguna tahu harus apa.
    function terjemahkanGagal(pesan) {
      if (/different from the old password/i.test(pesan || '')) {
        return ['Password baru sama dengan password lama', 'Gunakan password yang belum pernah kamu pakai sebelumnya, lalu simpan lagi.'];
      }
      if (/kata sandi minimal/i.test(pesan || '')) {
        return ['Password belum memenuhi syarat', pesan];
      }
      return ['Password gagal disimpan', pesan || 'Terjadi kesalahan di server. Coba beberapa saat lagi.'];
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      sembunyikanNotifikasi();
      const password = passwordEl.value;
      const confirmPassword = confirmEl.value;

      if (!password) {
        tampilkanNotifikasi('Password baru belum diisi', 'Ketik password baru yang ingin kamu pakai untuk masuk ke eSikap.');
        passwordEl.focus();
        return;
      }

      const kurang = SYARAT.filter((s) => !s.cek(password)).map((s) => s.nama);
      if (kurang.length) {
        tampilkanNotifikasi('Password belum memenuhi syarat', 'Masih kurang: ' + kurang.join(', ') + '. Lihat daftar syarat di bawah.');
        passwordEl.focus();
        return;
      }

      if (password !== confirmPassword) {
        tampilkanNotifikasi('Password tidak sama', 'Isian "Ulangi Password Baru" harus sama persis dengan "Password Baru".');
        confirmEl.focus();
        return;
      }

      tombolEl.disabled = true;
      tombolEl.textContent = 'MENYIMPAN...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, password }),
        });

        // Balasan non-JSON (mis. halaman error proxy) tetap dianggap gagal dari server,
        // bukan masalah koneksi.
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          tutupForm('Password Diperbarui', 'Password berhasil diubah',
            'Silakan masuk ke eSikap dengan password baru. Demi keamanan, akunmu otomatis keluar dari semua perangkat lain.',
            'sukses');
        } else if (res.status === 401) {
          tutupForm('Tautan Kedaluwarsa', 'Tautan reset password sudah tidak berlaku', data.message + ' ' + MINTA_ULANG);
        } else {
          const [judul, isi] = terjemahkanGagal(data.message);
          tampilkanNotifikasi(judul, isi);
        }
      } catch (err) {
        tampilkanNotifikasi('Tidak bisa terhubung ke server', 'Periksa koneksi internet kamu, lalu coba simpan lagi.');
      } finally {
        tombolEl.disabled = false;
        tombolEl.textContent = 'SIMPAN PASSWORD BARU';
      }
    });
  </script>
</body>
</html>

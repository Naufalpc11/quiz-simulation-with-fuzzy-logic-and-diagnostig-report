<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 16px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    #message { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Masukkan Password Baru</h2>
  <form id="resetForm">
    <input type="password" id="password" placeholder="Password baru" required minlength="8" />
    <input type="password" id="confirmPassword" placeholder="Ulangi password baru" required minlength="8" />
    <button type="submit">Simpan Password</button>
  </form>
  <p id="message"></p>

  <script>
    // Supabase mengirim token/error lewat hash (#access_token=... atau #error_code=...),
    // bukan query string, jadi harus dibaca di sisi klien — server tidak pernah menerima hash ini.
    const params = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = params.get('access_token');
    const errorCode = params.get('error_code');
    const errorDescription = params.get('error_description');
    const messageEl = document.getElementById('message');
    const formEl = document.getElementById('resetForm');

    if (errorCode) {
      // Supabase sudah mendeteksi token invalid/expired/dipakai ulang
      messageEl.innerText = errorCode === 'otp_expired'
        ? 'Tautan sudah kedaluwarsa. Silakan minta ulang reset password.'
        : (errorDescription || 'Tautan tidak valid.').replace(/\+/g, ' ');
      formEl.style.display = 'none';
    } else if (!accessToken) {
      messageEl.innerText = 'Tautan tidak valid. Silakan minta ulang reset password.';
      formEl.style.display = 'none';
    }

    // Bersihkan hash dari URL biar token tidak nyangkut di history browser
    window.history.replaceState({}, document.title, window.location.pathname);

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        messageEl.innerText = 'Konfirmasi password tidak cocok.';
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, password }),
        });

        const data = await res.json();
        messageEl.innerText = data.message;

        if (res.ok) {
          formEl.style.display = 'none';
        }
      } catch (err) {
        messageEl.innerText = 'Terjadi kesalahan. Coba lagi nanti.';
      }
    });
  </script>
</body>
</html>
